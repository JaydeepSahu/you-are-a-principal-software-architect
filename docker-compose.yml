# =============================================================================
# Enterprise AI Platform — Production-Grade Docker Compose Stack
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  # ---------------------------------------------------------------------------
  # Infrastructure Services
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-ai-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-ai_platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - enterprise-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_platform_user} -d ${POSTGRES_DB:-enterprise_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: enterprise-ai-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - enterprise-ai-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: enterprise-ai-prometheus
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - enterprise-ai-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: enterprise-ai-grafana
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    networks:
      - enterprise-ai-network
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # API Gateways & Core Services
  # ---------------------------------------------------------------------------
  aigateway-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: src/Gateways/EnterpriseAiPlatform.AiGateway.Api/EnterpriseAiPlatform.AiGateway.Api.csproj
        SERVICE_DLL: EnterpriseAiPlatform.AiGateway.Api.dll
    container_name: enterprise-ai-gateway
    restart: unless-stopped
    logging: *default-logging
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=${POSTGRES_DB:-enterprise_ai_db};Username=${POSTGRES_USER:-ai_platform_user};Password=${POSTGRES_PASSWORD:-SecretPassword123!}
      - ConnectionStrings__Redis=redis:6379
      - AiGateway__Authentication__PlatformJwt__Issuer=${PLATFORM_JWT_ISSUER:-https://identity.enterprise-ai-platform.test}
      - AiGateway__Authentication__PlatformJwt__Audience=${PLATFORM_JWT_AUDIENCE:-enterprise-ai-platform}
      - AiGateway__Authentication__PlatformJwt__SigningKey=${PLATFORM_JWT_SIGNING_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "5111:8080"
    networks:
      - enterprise-ai-network
    healthcheck: *api-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

