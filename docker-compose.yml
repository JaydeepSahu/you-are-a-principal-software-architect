# =============================================================================
# Enterprise AI Platform — Docker Compose (Root Wrapper)
# =============================================================================
#
# Thin wrapper that includes modular compose files from deployments/docker/.
# Requires Docker Compose v2.20+ (for 'include' directive).
#
# Usage:
#   docker compose --profile infrastructure --profile api up -d
#   docker compose --profile infrastructure --profile api --profile monitoring up -d
#
# Alternative (explicit file composition, no 'include' needed):
#   docker compose \
#     -f deployments/docker/docker-compose.yml \
#     -f deployments/docker/docker-compose.infrastructure.yml \
#     -f deployments/docker/docker-compose.services.yml \
#     -f deployments/docker/docker-compose.monitoring.yml \
#     -f deployments/docker/docker-compose.workers.yml up -d
#
# =============================================================================

include:
  - path: deployments/docker/docker-compose.yml
  - path: deployments/docker/docker-compose.infrastructure.yml
  - path: deployments/docker/docker-compose.services.yml
  - path: deployments/docker/docker-compose.monitoring.yml
  - path: deployments/docker/docker-compose.workers.yml
