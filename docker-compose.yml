version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-ai-postgres
    environment:
      POSTGRES_DB: enterprise_ai_db
      POSTGRES_USER: ai_platform_user
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform_user -d enterprise_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enterprise-ai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: enterprise-ai-prometheus
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.2.0
    container_name: enterprise-ai-grafana
    volumes:
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  aigateway-api:
    build:
      context: .
      dockerfile: Dockerfile.AiGateway
    container_name: enterprise-ai-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=enterprise_ai_db;Username=ai_platform_user;Password=SecretPassword123!
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agents-api:
    build:
      context: .
      dockerfile: Dockerfile.AgentsApi
    container_name: enterprise-ai-agents
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5003:8080"
    depends_on:
      redis:
        condition: service_healthy
