# =============================================================================
# Enterprise AI Platform — API & Host Services
# =============================================================================
#
# All services use the shared x-api-service anchor to eliminate duplication of:
#   restart, logging, healthcheck, networks
#
# Environment merging: <<: with *common-env, *postgres-env, *redis-env,
# *rabbitmq-env as appropriate per service.
#
# Ports: Only the AI Gateway exposes a published port (5111). All other
# services use 'expose' for internal Docker-network access only.
# See docker-compose.override.yml to re-publish ports for local development.
# =============================================================================

# -----------------------------------------------------------------------------
# YAML Anchors (repeated per-file for standalone validity)
# -----------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 10s

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-postgres-env: &postgres-env
  ConnectionStrings__PostgreSQL: Host=postgres;Database=${POSTGRES_DB:-enterprise_ai_db};Username=${POSTGRES_USER:-ai_platform_user};Password=${POSTGRES_PASSWORD}

x-redis-env: &redis-env
  ConnectionStrings__Redis: redis:6379

x-rabbitmq-env: &rabbitmq-env
  ConnectionStrings__RabbitMQ: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/

x-api-service: &api-service
  restart: unless-stopped
  logging: *default-logging
  healthcheck: *api-healthcheck
  networks:
    - enterprise-ai-network

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # AI Gateway (public entry point — published port)
  # ---------------------------------------------------------------------------
  aigateway-api:
    <<: *api-service
    profiles: ["api"]
    # CI/CD: Replace build block with pre-built image
    # image: ${CONTAINER_REGISTRY}/enterprise-ai/gateway:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: src/Gateways/EnterpriseAiPlatform.AiGateway.Api/EnterpriseAiPlatform.AiGateway.Api.csproj
        SERVICE_DLL: EnterpriseAiPlatform.AiGateway.Api.dll
    environment:
      <<:
        - *common-env
        - *postgres-env
        - *redis-env
        - *rabbitmq-env
      AiGateway__Authentication__PlatformJwt__Issuer: ${PLATFORM_JWT_ISSUER:-https://identity.enterprise-ai-platform.test}
      AiGateway__Authentication__PlatformJwt__Audience: ${PLATFORM_JWT_AUDIENCE:-enterprise-ai-platform}
      AiGateway__Authentication__PlatformJwt__SigningKey: ${PLATFORM_JWT_SIGNING_KEY:?PLATFORM_JWT_SIGNING_KEY must be set}
      AiGateway__RateLimiting__RedisConnectionString: redis:6379,abortConnect=false
      AiGateway__Forwarding__BaseAddress: http://provideradapters-host:8080/internal/ai/
    ports:
      - "5111:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Identity API
  # ---------------------------------------------------------------------------
  identity-api:
    <<: *api-service
    profiles: ["api"]
    # CI/CD: Replace build block with pre-built image
    # image: ${CONTAINER_REGISTRY}/enterprise-ai/identity:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: src/Services/Identity/EnterpriseAiPlatform.Identity.Api/EnterpriseAiPlatform.Identity.Api.csproj
        SERVICE_DLL: EnterpriseAiPlatform.Identity.Api.dll
    environment:
      <<:
        - *common-env
        - *postgres-env
        - *redis-env
        - *rabbitmq-env
      ConnectionStrings__IdentityDatabase: Host=postgres;Database=${POSTGRES_DB:-enterprise_ai_db};Username=${POSTGRES_USER:-ai_platform_user};Password=${POSTGRES_PASSWORD}
      Identity__PlatformJwt__Issuer: ${PLATFORM_JWT_ISSUER:-https://identity.enterprise-ai-platform.test}
      Identity__PlatformJwt__Audience: ${PLATFORM_JWT_AUDIENCE:-enterprise-ai-platform}
      Identity__PlatformJwt__SigningKey: ${PLATFORM_JWT_SIGNING_KEY:?PLATFORM_JWT_SIGNING_KEY must be set}
    expose:
      - "8080"
    depends_on:
